<script>
window.hardReloadApp = function() {
  window.location.reload();
};
window.cleanAppCache = function() {
  try {
    sessionStorage.clear();
    localStorage.removeItem('dp_me');
    document.documentElement.classList.remove('is-logged-in');
  } catch(e){}
  window.location.reload();
};
window.addEventListener('error', function(e) {
  console.warn('App global error caught:', e.message || e);
  var lg = document.getElementById('lg');
  var app = document.getElementById('app');
  if (lg && (!app || app.style.display !== 'flex')) {
    document.documentElement.classList.remove('is-logged-in');
    lg.style.display = 'flex';
  }
});
window.addEventListener('unhandledrejection', function(e) {
  console.warn('App unhandled promise rejection:', e.reason);
});
(function(){
  try {
    var search = window.location.search || '';
    if (search.indexOf('mode=print') !== -1) {
      var printHtml = localStorage.getItem('dp_print_doc');
      if (printHtml) {
        document.open();
        document.write(printHtml);
        document.close();
        return;
      }
    }
  } catch(e){}
  try{
    var raw = localStorage.getItem('dp_me');
    if (raw) {
      var cred = null;
      try { cred = JSON.parse(raw); } catch(e) { cred = { u: raw }; }
      if (cred && cred.u && cred.p) {
        document.documentElement.classList.add('is-logged-in');
      }
    }
  }catch(e){}
})();
</script>

const EN = I18N.en;

const t = s => {
    if (!s || typeof s !== 'string') return s;
    let lang = (S && S.lg) || localStorage.getItem('dp_lang') || 'bn';
    if (lang === 'bn') return s;
    if (I18N[lang] && I18N[lang][s]) return I18N[lang][s];
    if (I18N.en && I18N.en[s]) return I18N.en[s];
    return s;
};

window.changeAppLanguage = function(code) {
    if (!S) S = {};
    S.lg = code;
    try {
        localStorage.setItem('dp_lang', code);
    } catch(e) {}
    sv();
    applyLanguageToPage();
    hd();
    go(S.pg || 'sale');
    mx();
};

window.openLanguageModal = function() {
    let cur = (S && S.lg) || localStorage.getItem('dp_lang') || 'bn';
    let langs = [
        { code: 'bn', flag: '🇧🇩', name: 'বাংলা', sub: 'Bengali (মাদার ল্যাঙ্গুয়েজ - ডিফল্ট)' },

        { code: 'ar', flag: '🇸🇦', name: 'العربية', sub: 'Arabic (نسخة كاملة باللغة العربية)' },

        <div style="padding:4px">
            <h3 style="margin-top:0;display:flex;align-items:center;gap:8px;color:var(--p)">
                🌐 ভাষা পরিবর্তন / Select Language

    md(html);

function applyLanguageToPage() {
    let cur = (S && S.lg) || localStorage.getItem('dp_lang') || 'bn';
    let langMap = {
        bn: { flag: '🇧🇩', name: 'বাংলা' },
        en: { flag: '🇺🇸', name: 'English' },
        ar: { flag: '🇸🇦', name: 'العربية' },
        hi: { flag: '🇮🇳', name: 'हिन्दी' }
    };
    let lObj = langMap[cur] || langMap.bn;
    let labelEl = $('#tools-lang-label');
    if (labelEl) labelEl.textContent = lObj.flag + ' ' + lObj.name;

    if (cur === 'ar') {
        document.documentElement.setAttribute('dir', 'rtl');
    } else {
        document.documentElement.setAttribute('dir', 'ltr');
    }

    let closingSpan = $('#btn-closing-label');
    if (closingSpan) closingSpan.textContent = t('ক্লোজিং');
    let notesSpan = $('#btn-notes-label');
    if (notesSpan) notesSpan.textContent = t('নোট কাউন্টার');
    let cloudLabel = $('#tools-cloud-label');
    if (cloudLabel) cloudLabel.textContent = t('ডাটাবেজ লাইভ');
    let installSpan = $('#btn-pwa-label');
    if (installSpan) installSpan.textContent = t('অ্যাপ ইনস্টল');
    let umSaasLabel = $('#um-saas-label');
    if (umSaasLabel) umSaasLabel.textContent = t('সুপার অ্যাডমিন ও SaaS পোর্টাল');
    let umPwLabel = $('#um-pw-label');
    if (umPwLabel) umPwLabel.textContent = t('পাসওয়ার্ড');
    let umLoLabel = $('#um-lo-label');
    if (umLoLabel) umLoLabel.textContent = t('লগআউট');
    let netStat = $('#net-stat');
    if (netStat) {
        let isOnline = navigator.onLine;
        netStat.textContent = isOnline ? ('🟢 ' + t('অনলাইন')) : ('🔴 ' + t('অফলাইন'));
    }

        }

                sessionStorage.setItem('dp_super_admin', '1');

        if (isMasterAuth) {
            doSuccess();
            return;
        }

        // 2. ক্লাউড ফলব্যাক
        if (err) err.textContent = '⏳ ক্লাউড থেকে পিন যাচাই হচ্ছে...';

function initAppSession() {
    try {
        let params = new URLSearchParams(window.location.search);
        let urlShop = (params.get('shop') || '').trim();
        let curHash = location.hash || '';
        if (!urlShop && curHash.includes('shop=')) {
            urlShop = curHash.split('shop=')[1].split('&')[0];
        } else if (!urlShop && curHash.startsWith('#order_')) {
            urlShop = curHash.replace('#order_', '');
        }

        let isCustomerOrder = params.has('order') || params.get('order') === '1' || params.get('view') === 'order' || curHash.startsWith('#order');

        if (urlShop && urlShop !== CURRENT_SHOP_ID) {
            let t = Array.isArray(TENANTS) ? TENANTS.find(x => x.id.toLowerCase() === urlShop.toLowerCase()) : null;
            loadShopState(urlShop, t);
        }

        let dlParam = params.get('download');
        if (dlParam === '1' || dlParam === 'html' || dlParam === 'app') {
            setTimeout(() => { downloadStandaloneSoftware(); }, 600);
        } else if (dlParam === 'zip' || dlParam === 'dist') {
            setTimeout(() => { downloadDistZip(); }, 600);
        }

        let shopName = (S && S.shop && S.shop.n) || 'Shop Management';
        let ln = $('#ln');
        if (ln) ln.textContent = shopName;
        let ll = $('#ll');
        if (ll) lgi(ll);

        let authBox = $('#lg-auth-box');
        let custBox = $('#lg-customer-box');

        if (isCustomerOrder) {
            if (authBox) authBox.style.display = 'none';
            if (custBox) custBox.style.display = 'grid';
            document.documentElement.classList.remove('is-logged-in');
            let lg = $('#lg');
            if (lg) lg.style.display = 'flex';
            let app = $('#app');
            if (app) app.style.display = 'none';
            opn(urlShop || CURRENT_SHOP_ID);
            return;
        } else {
            if (authBox) authBox.style.display = 'grid';
            if (custBox) custBox.style.display = 'none';
        }

        let u = getSavedUser();
        if (u) {
            try {
                enter(u, 0);
            } catch(enterErr) {
                console.error('Error entering user session:', enterErr);
                document.documentElement.classList.remove('is-logged-in');
                let lg = $('#lg');
                if (lg) lg.style.display = 'flex';
                let app = $('#app');
                if (app) app.style.display = 'none';
            }
        } else {
            document.documentElement.classList.remove('is-logged-in');
            let lg = $('#lg');
            if (lg) lg.style.display = 'flex';
            let app = $('#app');
            if (app) app.style.display = 'none';
            try { localStorage.removeItem('dp_me'); } catch(e){}
        }
    } catch(err) {
        console.error('Crash guard: initAppSession error:', err);
        document.documentElement.classList.remove('is-logged-in');
        let lg = $('#lg');
        if (lg) lg.style.display = 'flex';
    }
}

P.sale_ = () => { lpl(); ct(); };
function lpl() {
    let q = $('#q').value.toLowerCase(), c = $('#cf').value;
    $('#pl').innerHTML = S.pr.filter(x => (!c || x.c == c) && (x.n + (x.bc || '') + (x.c || '')).toLowerCase().includes(q)).map(x => {
        let uStr = getUnitLabel(x.unit);
        return `<div class="pi" onclick="ad(${x.id})">${x.ph ? `<img src="${x.ph}">` : '📦'}<b>${E(x.n)}</b><br><span style="color:#0f766e;font-weight:700">৳${f(x.s)}/${uStr}</span> · <span style="color:#475569">${t('স্টক')} ${x.st} ${uStr}</span></div>`;
    }).join('') || '—';
}
const gc = () => S.cu.find(c => c.id == $('#cs').value);
function cc() { $('#nw').style.display = $('#cs').value ? 'none' : 'flex'; ct(); }

function ad(id, qty = 1) {
    let p = S.pr.find(x => x.id == id);
    if (!p) return;
    let i = cart.find(x => x.id == id);
    let u = p.unit || 'pc';
    if (i) {
        i.q = Math.round((i.q + qty) * 1000) / 1000;
    } else {
        cart.push({ id, n: p.n, q: qty, p: p.s, c: p.b || 0, ic: p.ic || 0, u });
    }
    ct();
}

function qy(i, d) {
    if (!cart[i]) return;
    let u = cart[i].u;
    let step = 1;
    if (u === 'kg' || u === 'l') {
        step = (cart[i].q < 1) ? 0.25 : 0.5;
    } else if (u === 'gm' || u === 'ml') {
        step = 50;
    }
    let delta = d * step;
    let newQ = Math.round((cart[i].q + delta) * 1000) / 1000;
    if (newQ <= 0) {
        cart.splice(i, 1);
    } else {
        cart[i].q = newQ;
    }
    ct();
}

function setCartQty(i, val) {
    if (!cart[i]) return;
    let q = parseFloat(val);
    if (!isNaN(q) && q > 0) {
        cart[i].q = Math.round(q * 1000) / 1000;
        let c = gc(), pv = c ? c.d : 0, s = cart.reduce((a, x) => a + x.q * x.p, 0);
        let rowTot = document.getElementById('cart-row-tot-' + i);
        if (rowTot) rowTot.textContent = '৳' + f(cart[i].q * cart[i].p);
        let billEl = document.getElementById('cart-bill-tot');
        if (billEl) billEl.textContent = '৳' + f(s);
        let payEl = document.getElementById('cart-pay-tot');
        if (payEl) payEl.textContent = '৳' + f(Math.max(0, s + pv));
        let qlbl = document.getElementById('cart-qty-lbl-' + i);
        if (qlbl) qlbl.textContent = cart[i].q + ' ' + getUnitLabel(cart[i].u);
        rs();
    }
}

function clearCartConfirm() {

}

            </tr>`).join('')}
        </table></div>`;
    }

    let summaryHtml = `
    <div style="background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 14px;margin:8px 0;line-height:1.7">

            <span>📦 বর্তমান পণ্যের মোট বিল:</span>
            <b id="cart-bill-tot">৳${f(s)}</b>
        </div>
        ${pv > 0 ? `

                <span>⚠ কাস্টমারের পূর্বের বকেয়া:</span>

        <div style="display:flex;justify-content:space-between;font-size:16px;font-weight:800;border-top:1.5px dashed #cbd5e1;padding-top:6px;margin-top:6px;color:var(--p)">

function rs() {
    let c = gc(), s = cart.reduce((a, x) => a + x.q * x.p, 0), pv = c ? c.d : 0, net = s + pv, tot = Math.max(0, net), p = +paid || 0;
    let rsEl = $('#rs');
    if (!rsEl) return;
    if (!cart.length) { rsEl.innerHTML = ''; return; }
    if (p > tot) {
        rsEl.innerHTML = `<div class="ok" style="font-weight:700">✅ ফেরত পাবেন: ৳${f(p - tot)}</div><div class="r" style="align-items:center;margin-top:4px"><small>ফেরত দিচ্ছি (৳) — বাকিটা অগ্রিম থাকবে</small><input id="rfd" type="number" min="0" max="${p - tot}" value="${p - tot}" style="max-width:120px"></div>`;
    } else if (p === tot) {
        rsEl.innerHTML = `<div class="ok" style="font-weight:700">✅ সম্পূর্ণ পরিশোধিত</div>` + (net < 0 ? `<div class="ok">অগ্রিম ব্যালেন্স থাকবে: ৳${f(-net)}</div>` : '');
    } else {
        let combinedDue = Math.max(0, tot - p);
        rsEl.innerHTML = `<div class="red" style="font-weight:700;font-size:14px;margin-top:4px">
            বকেয়া / বাকি: ৳${f(combinedDue)}
            ${pv > 0 ? `<span style="font-size:12px;font-weight:normal;color:#7f1d1d"> (নতুন বিল ও পূর্বের বকেয়া মিলিয়ে)</span>` : ''}
        </div>`;
    }
}

function filterCustomerSelect(q) {
    let sel = $('#cs');
    if (!sel) return;
    let val = sel.value;
    let query = (q || '').toLowerCase().trim();
    let filtered = !query ? S.cu : S.cu.filter(c => (c.n + ' ' + (c.m || '')).toLowerCase().includes(query));
    sel.innerHTML = `<option value="">👤 ${t('নতুন/ওয়াকিং কাস্টমার')}</option>` +
        filtered.map(c => `<option value="${c.id}" ${c.id == val ? 'selected' : ''}>${E(c.n)} - ${E(c.m)}${c.d < 0 ? ' (অগ্রিম ৳' + f(-c.d) + ')' : c.d > 0 ? ' ⚠ (বাকি ৳' + f(c.d) + ')' : ''}</option>`).join('');
}

function checkExistingCustomerByMobile(m) {
    let clean = String(m || '').replace(/\D/g, '');
    if (clean.length >= 6) {
        let matched = S.cu.find(c => c.m && String(c.m).replace(/\D/g, '').endsWith(clean));
        if (matched) {
            let sel = $('#cs');
            if (sel && sel.value !== matched.id) {
                sel.value = matched.id;
                cc();
            }
        }
    }
}

function handleBarcodeScan(e, input) {
    if (e.key === 'Enter') {
        e.preventDefault();
        let code = (input.value || '').trim();
        if (!code) return;
        scanAndAddToCart(code);
        input.value = '';
        input.focus();
    }
}

function handleSearchBarcodeEnter(e, input) {
    if (e.key === 'Enter') {
        e.preventDefault();
        let code = (input.value || '').trim();
        if (!code) return;
        scanAndAddToCart(code);
        input.value = '';
        lpl();
    }
}

function scanAndAddToCart(code) {
    if (!code) return;
    let clean = String(code).trim().toLowerCase();
    // 1. Exact match by barcode (bc), product code (c), or id
    let p = S.pr.find(x => (x.bc && String(x.bc).toLowerCase() === clean) ||
                           (x.c && String(x.c).toLowerCase() === clean) ||
                           (String(x.id).toLowerCase() === clean));
    // 2. Partial match if no exact match
    if (!p) {
        p = S.pr.find(x => (x.bc && String(x.bc).toLowerCase().includes(clean)) ||
                           (x.n && x.n.toLowerCase().includes(clean)));
    }

    if (p) {
        ad(p.id, 1);
        playBeepSound();
        let toast = document.getElementById('scan-feedback-toast');
        if (toast) {
            toast.textContent = `✔ "${p.n}" কার্টে যোগ হয়েছে`;
            toast.style.display = 'inline-block';
            clearTimeout(toast._t);
            toast._t = setTimeout(() => { toast.style.display = 'none'; }, 2000);
        }
    } else {
        playErrorBeepSound();
        alert(`❌ বারকোড/কোড "${code}" দিয়ে কোনো পণ্য পাওয়া যায়নি!`);
    }
}

function playBeepSound() {
    try {
        let AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        let ctx = new AudioCtx();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
    } catch(e) {}
}

function playErrorBeepSound() {
    try {
        let AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        let ctx = new AudioCtx();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.25);
    } catch(e) {}
}

let POS_CAMERA_STREAM = null;
let POS_CAMERA_TIMER = null;
window.openPosCameraScanner = async function() {
    md(`<h3>📷 বারকোড ও QR স্ক্যানার</h3>
        <p style="font-size:12px;color:#64748b;margin:0 0 6px">ক্যামেরার সামনে পণ্যের বারকোড ধরুন, স্ক্যান হওয়ামাত্র স্বয়ংক্রিয়ভাবে কার্টে যুক্ত হবে।</p>
        <div style="position:relative;width:100%;max-width:400px;margin:0 auto">
            <video id="pos-cam-video" autoplay playsinline muted style="width:100%;border-radius:10px;background:#000;max-height:260px;object-fit:cover"></video>
            <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;height:40%;border:2px dashed #16a34a;border-radius:8px;pointer-events:none"></div>
        </div>
        <div id="pos-cam-msg" style="text-align:center;font-weight:700;font-size:13px;color:#0f766e;margin-top:6px">ক্যামেরা চালু হচ্ছে...</div>
        <div class="r" style="margin-top:8px">
            <button class="o" onclick="closePosCameraScanner()" style="width:100%">✕ স্ক্যানার বন্ধ করুন</button>
        </div>`);

    let video = $('#pos-cam-video');
    let msg = $('#pos-cam-msg');
    try {
        POS_CAMERA_STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        if (video) {
            video.srcObject = POS_CAMERA_STREAM;
            if (msg) msg.textContent = '👀 বারকোড খুঁজছে... ক্যামেরার সামনে বারকোড ধরুন';
        }
        if ('BarcodeDetector' in window) {
            let detector = new BarcodeDetector({ formats: ['qr_code', 'ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e'] });
            let lastScanTime = 0;
            let lastScanCode = '';
            POS_CAMERA_TIMER = setInterval(async () => {
                if (!video || $('#md').style.display !== 'flex') {
                    closePosCameraScanner();
                    return;
                }
                try {
                    let codes = await detector.detect(video);
                    if (codes && codes.length) {
                        let detectedVal = codes[0].rawValue;
                        let now = Date.now();
                        if (detectedVal !== lastScanCode || now - lastScanTime > 2000) {
                            lastScanCode = detectedVal;
                            lastScanTime = now;
                            scanAndAddToCart(detectedVal);
                            if (msg) msg.innerHTML = `✅ স্ক্যান হয়েছে: <b>${detectedVal}</b>`;
                        }
                    }
                } catch(e) {}
            }, 300);

window.copyOnlineOrderLink = function(shopId) {
    let sid = shopId || CURRENT_SHOP_ID || 'default';
    let url = location.origin + location.pathname + '?shop=' + encodeURIComponent(sid) + '&order=1';
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
            alert('✅ কাস্টমারদের জন্য অনলাইন অর্ডার লিংক কপি হয়েছে:\n\n' + url + '\n\nএই লিংকে প্রবেশ করলে কাস্টমাররা সরাসরি আপনার দোকানের পণ্য দেখে অনলাইনে অর্ডার পাঠাতে পারবে। কোনো লগইন বা পাসওয়ার্ড লাগবে না।');
        }).catch(() => {
            prompt('নিচের অনলাইন অর্ডার লিংকটি কপি করুন:', url);
        });
    } else {
        prompt('নিচের অনলাইন অর্ডার লিংকটি কপি করুন:', url);
    }
};

// ক্লায়েন্টকে ১-ক্লিকে অ্যাপ ইনস্টল পারমিশন প্রদান বা প্রত্যাহার
window.toggleTenantInstallPermission = function(id) {
    let t = TENANTS.find(x => x.id === id);
    if (!t) return;
    if (!t.permissions) t.permissions = {};
    t.permissions.p_install = !t.permissions.p_install;
    saveTenants();

    // ক্লায়েন্ট স্টোরেজ অবজেক্ট আপডেট
    try {
        let raw = localStorage.getItem('dp_' + id);
        if (raw) {
            let data = JSON.parse(raw);
            if (data && data.shop) {
                if (!data.shop.permissions) data.shop.permissions = {};
                data.shop.permissions.p_install = t.permissions.p_install;
                localStorage.setItem('dp_' + id, JSON.stringify(data));
            }
        }
    } catch(e){}

    // ক্লাউড ডাটাবেজ আপডেট
    if (DB && typeof DB.doc === 'function') {
        DB.doc('shops/' + id + '/cfg/main').get().then(snap => {
            let v = snap && typeof snap.data === 'function' ? snap.data() : (snap && snap.data);
            if (v && v.shop) {
                if (!v.shop.permissions) v.shop.permissions = {};
                v.shop.permissions.p_install = t.permissions.p_install;
                DB.doc('shops/' + id + '/cfg/main').set(v).catch(() => {});
            }
        }).catch(() => {});
    }

    if (CURRENT_SHOP_ID === id) {
        if (!S.shop.permissions) S.shop.permissions = {};
        S.shop.permissions.p_install = t.permissions.p_install;
        hd();
        updatePwaUI();
    }

    filterTenantsTable();
    let statusText = t.permissions.p_install ? 'অনুমোদিত (সক্রিয়)' : 'বন্ধ (লক)';
    alert(`✅ "${t.name}" দোকানে মোবাইল ও পিসিতে অ্যাপ ইনস্টল অপশন এখন: ${statusText}`);
};

    window.setUpgradePlan = function(days, label, btn) {
        document.querySelectorAll('.sub-up-btn').forEach(b => {
            b.classList.add('o');
            b.style.background = '';
            b.style.color = '';
        });
        if (btn) {
            btn.classList.remove('o');
            btn.style.background = '#0f766e';
            btn.style.color = '#fff';
        }
        let expEl = $('#up_expiry');
        let planEl = $('#up_plan_name');
        if (planEl) planEl.value = label;
        if (days === 0) {
            if (expEl) expEl.value = '';
        } else {
            let target = new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
            if (expEl) expEl.value = target;
        }
    };
};

window.confirmUpgradeTenant = function(id) {
    let t = TENANTS.find(x => x.id === id);
    if (!t) return;
    let newExpiry = ($('#up_expiry') ? $('#up_expiry').value : '').trim();
    let newPlan = ($('#up_plan_name') ? $('#up_plan_name').value : '১ বছর (৩৬৫ দিন)').trim();
    let grantInstall = $('#up_grant_install') ? $('#up_grant_install').checked : true;

    // ফুল সংস্করণে রূপান্তর
    t.isDemo = false;
    t.subPlan = newPlan;
    t.expiry = newExpiry;
    if (!t.permissions) t.permissions = {};
    if (grantInstall) t.permissions.p_install = true;

    saveTenants();

    // ক্লায়েন্টের লোকাল ডাটাবেজে (dp_{id}) কোনো ডাটা মোছা ছাড়া শপ মেটাডাটা আপডেট
    try {
        let raw = localStorage.getItem('dp_' + id);
        if (raw) {
            let data = JSON.parse(raw);
            if (data && data.shop) {
                data.shop.isDemo = false;
                data.shop.subPlan = newPlan;
                data.shop.expiry = newExpiry;
                if (!data.shop.permissions) data.shop.permissions = {};
                if (grantInstall) data.shop.permissions.p_install = true;
                localStorage.setItem('dp_' + id, JSON.stringify(data));
            }
        }
    } catch(e){}

    // ক্লাউড ফায়ারবেস কনফিগ আপডেট
    if (DB && typeof DB.doc === 'function') {
        DB.doc('shops/' + id + '/cfg/main').get().then(snap => {
            let v = snap && typeof snap.data === 'function' ? snap.data() : (snap && snap.data);
            if (v && v.shop) {
                v.shop.isDemo = false;
                v.shop.subPlan = newPlan;
                v.shop.expiry = newExpiry;
                if (!v.shop.permissions) v.shop.permissions = {};
                if (grantInstall) v.shop.permissions.p_install = true;
                DB.doc('shops/' + id + '/cfg/main').set(v).catch(() => {});
            }
        }).catch(() => {});
    }

    if (CURRENT_SHOP_ID === id) {
        S.shop.isDemo = false;
        S.shop.subPlan = newPlan;
        S.shop.expiry = newExpiry;
        if (!S.shop.permissions) S.shop.permissions = {};
        if (grantInstall) S.shop.permissions.p_install = true;
        sv();
        hd();
        updatePwaUI();
    }

    mx();
    if (S.pg === 'saas') go('saas');

    let cleanMobile = String(t.mobile || '').replace(/\D/g, '');
    if (cleanMobile.startsWith('0')) cleanMobile = cleanMobile.slice(1);
    let host = location.origin + location.pathname;
    let shopLoginLink = `${host}?shop=${t.id}`;
    let upgradeMsg = `🎉 অভিনন্দন ${t.owner}! আপনার "${t.name}" দোকানের সফটওয়্যারটি সম্পূর্ণ ফুল পেইড সংস্করণে (Full Paid License) রূপান্তর করা হয়েছে।

✅ আপনার ডেমো চলাকালীন এন্ট্রি করা সমস্ত পণ্য, কাস্টমার, স্টক ও হিসাবের ১০০% ডাটা সুরক্ষিত ও অপরিবর্তিত রাখা হয়েছে!
⏳ সাবস্ক্রিপশন মেয়াদ: ${newPlan} (শেষ তারিখ: ${newExpiry || 'আজীবন'})
📲 অ্যাপ ইনস্টল অপশন: ${grantInstall ? 'অনুমোদিত ও সক্রিয়' : 'সংরক্ষিত'}

📱 আপনার দোকানের সরাসরি লগইন লিংক:
${shopLoginLink}

👤 অ্যাডমিন ইউজারনেম: ${t.adminUser}

ধন্যবাদ আমাদের সফটওয়্যার ব্যবহারের জন্য!`;

    let waUrl = `https://wa.me/880${cleanMobile}?text=${encodeURIComponent(upgradeMsg)}`;

    setTimeout(() => {
        md(`<div style="text-align:left">
            <h3 style="color:#16a34a;margin-top:0">🎉 ফুল পেইড সংস্করণ সফলভাবে সক্রিয় হয়েছে!</h3>
            <div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:12px;margin:10px 0;line-height:1.6">
                <div>দোকান: <b>${E(t.name)}</b> (মালিক: <b>${E(t.owner)}</b>)</div>
                <div style="color:#166534;font-size:13px;margin-top:4px">
                    💎 <b>লাইসেন্স:</b> সম্পূর্ণ ফুল পেইড সংস্করণ · মেয়াদ: <b>${E(newPlan)}</b> (${E(newExpiry || 'আজীবন')})
                </div>
                <div style="color:#0f766e;font-size:12px;margin-top:4px">
                    ✅ ডেমোর সকল ডাটা (পণ্য, কাস্টমার, সেলস, ক্যাশ) ১০০% সংরক্ষিত রয়েছে।
                </div>
            </div>
            <div style="display:grid;gap:8px">

                </a>
                <button class="o" onclick="inspectShop('${t.id}')" style="background:#0f766e;color:#fff">👁️ দোকানটি পরিদর্শনে প্রবেশ করুন</button>

function filterTenantsTable() {

function getPermissionsFromChecklist(prefix) {
    let map = {};
    ALL_PERMISSIONS.forEach(p => {
        let el = document.getElementById(`${prefix}_perm_${p.k}`);
        map[p.k] = el ? el.checked : false;
    });
    return map;
}

window.setSubDuration = function(days, planLabel, btnEl) {
    window.__selectedSubDays = days;
    window.__selectedSubPlan = planLabel;
    document.querySelectorAll('.sub-plan-btn').forEach(b => {
        b.style.background = '';
        b.style.color = '';
        b.classList.add('o');
    });
    if (btnEl) {
        btnEl.classList.remove('o');
        btnEl.style.background = '#0f766e';
        btnEl.style.color = '#fff';
    }
    let customBox = $('#cs_custom_days_box');
    if (customBox) customBox.style.display = 'none';

    let expInput = $('#cs_expiry');
    let previewEl = $('#cs_sub_preview');
    let badgeEl = $('#cs_sub_badge');
    let todayStr = td();

    if (days === 0) {
        if (expInput) expInput.value = '';
        if (badgeEl) badgeEl.textContent = '♾️ আজীবন (Lifetime)';
        if (previewEl) previewEl.innerHTML = `📅 <b>মেয়াদ পর্যালোচনা:</b> আজীবন (Lifetime) সাবস্ক্রিপশন — কোনো মেয়াদোত্তীর্ণের তারিখ নেই`;
    } else {
        let target = new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
        if (expInput) expInput.value = target;
        if (badgeEl) badgeEl.textContent = planLabel;
        if (previewEl) previewEl.innerHTML = `📅 <b>মেয়াদ পর্যালোচনা:</b> শুরু: ${todayStr} ➔ শেষ: ${target} (মোট ${days} দিন সাবস্ক্রিপশন সক্রিয়)`;
    }
};

window.toggleCustomDays = function(btnEl) {
    document.querySelectorAll('.sub-plan-btn').forEach(b => {
        b.style.background = '';
        b.style.color = '';
        b.classList.add('o');
    });
    if (btnEl) {
        btnEl.classList.remove('o');
        btnEl.style.background = '#0f766e';
        btnEl.style.color = '#fff';
    }
    let customBox = $('#cs_custom_days_box');
    if (customBox) {
        customBox.style.display = 'flex';
        let inp = $('#cs_custom_days_inp');
        if (inp) { inp.focus(); applyCustomDays(inp.value || 30); }
    }
};

window.applyCustomDays = function(val) {
    let days = +val || 30;
    window.__selectedSubDays = days;
    window.__selectedSubPlan = days + ' দিন (কাস্টম)';
    let target = new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);
    let expInput = $('#cs_expiry');
    let previewEl = $('#cs_sub_preview');
    let badgeEl = $('#cs_sub_badge');
    if (expInput) expInput.value = target;
    if (badgeEl) badgeEl.textContent = days + ' দিন';
    if (previewEl) previewEl.innerHTML = `📅 <b>মেয়াদ পর্যালোচনা:</b> শুরু: ${td()} ➔ শেষ: ${target} (মোট ${days} দিন সাবস্ক্রিপশন সক্রিয়)`;
};

window.manualExpiryChange = function(newDate) {
    if (!newDate) {
        window.__selectedSubDays = 0;
        window.__selectedSubPlan = 'আজীবন (Lifetime)';
        if ($('#cs_sub_badge')) $('#cs_sub_badge').textContent = 'আজীবন';
        if ($('#cs_sub_preview')) $('#cs_sub_preview').innerHTML = `📅 <b>মেয়াদ পর্যালোচনা:</b> আজীবন (Lifetime)`;
        return;
    }
    let diffDays = Math.round((new Date(newDate) - new Date(td())) / 864e5);
    window.__selectedSubDays = diffDays;
    window.__selectedSubPlan = diffDays > 0 ? diffDays + ' দিন' : 'মেয়াদোত্তীর্ণ';
    if ($('#cs_sub_badge')) $('#cs_sub_badge').textContent = diffDays + ' দিন';
    if ($('#cs_sub_preview')) $('#cs_sub_preview').innerHTML = `📅 <b>মেয়াদ পর্যালোচনা:</b> শুরু: ${td()} ➔ শেষ: ${newDate} (অবশিষ্ট ${diffDays} দিন)`;
};

function saveEditedShop(id) {
    let t = TENANTS.find(x => x.id === id);
    if (!t) return;
    t.name = ($('#ed_name') ? $('#ed_name').value : t.name).trim();
    t.owner = ($('#ed_owner') ? $('#ed_owner').value : t.owner).trim();
    t.mobile = ($('#ed_mobile') ? $('#ed_mobile').value : t.mobile).trim();
    t.email = ($('#ed_email') ? $('#ed_email').value : '').trim();
    t.adminUser = ($('#ed_user') ? $('#ed_user').value : t.adminUser).trim();
    t.adminPass = ($('#ed_pass') ? $('#ed_pass').value : t.adminPass).trim();
    t.expiry = ($('#ed_expiry') ? $('#ed_expiry').value : t.expiry).trim();
    t.subPlan = ($('#ed_sub_plan') ? $('#ed_sub_plan').value : (t.subPlan || '১ বছর (৩৬৫ দিন)')).trim();
    t.isDemo = ($('#ed_is_demo') ? $('#ed_is_demo').value : '0') === '1';
    t.status = ($('#ed_status') ? $('#ed_status').value : t.status);
    t.notes = ($('#ed_notes') ? $('#ed_notes').value : '').trim();
    t.permissions = getPermissionsFromChecklist('ed');

    saveTenants();

    // যদি বর্তমান পরিদর্শনে থাকা শপ হয় তবে স্টেট আপডেট
    if (CURRENT_SHOP_ID === id) {
        S.shop.n = t.name;
        S.shop.o = t.owner;
        S.shop.m = t.mobile;
        S.shop.e = t.email;
        S.shop.isDemo = t.isDemo;
        S.shop.subPlan = t.subPlan;
        S.shop.expiry = t.expiry;
        S.shop.permissions = t.permissions;
        let adminUser = S.users.find(u => u.r === 'admin');
        if (adminUser) {
            adminUser.u = t.adminUser;
            adminUser.p = t.adminPass;
            adminUser.pm = t.permissions;
        }
        sv();
        hd();
    } else if (DB) {
        DB.doc('shops/' + id + '/cfg/main').get().then(snap => {
            let v = snap && typeof snap.data === 'function' ? snap.data() : (snap && snap.data);
            if (v && v.shop) {
                v.shop.n = t.name;
                v.shop.o = t.owner;
                v.shop.m = t.mobile;
                v.shop.e = t.email;
                v.shop.isDemo = t.isDemo;
                v.shop.subPlan = t.subPlan;
                v.shop.expiry = t.expiry;
                v.shop.permissions = t.permissions;
                if (Array.isArray(v.users) && v.users.length) {
                    v.users[0].u = t.adminUser;
                    v.users[0].p = t.adminPass;
                    v.users[0].pm = t.permissions;
                }
                DB.doc('shops/' + id + '/cfg/main').set(v).catch(() => {});
            }
        }).catch(() => {});
    }

    mx();
    if (S.pg === 'saas') go('saas');
    alert('✅ ক্লায়েন্ট শপের তথ্য সফলভাবে আপডেট হয়েছে!');
}

window._auDateFilter = window._auDateFilter || '';
window._auDateFilterEnd = window._auDateFilterEnd || '';
window._auSearchText = window._auSearchText || '';

window.parseEntryDate = function(item) {
    if (item.d && /^\d{4}-\d{2}-\d{2}$/.test(item.d)) return item.d;
    if (item.ts) {
        try { return new Date(item.ts).toISOString().slice(0, 10); } catch(e){}
    }
    if (item.t) {
        try {
            let parsed = new Date(item.t);
            if (!isNaN(parsed.getTime())) return parsed.toISOString().slice(0, 10);
            // Match Bengali / English patterns like DD/MM/YYYY or YYYY-MM-DD
            let m1 = item.t.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
            if (m1) return m1[1] + '-' + String(m1[2]).padStart(2, '0') + '-' + String(m1[3]).padStart(2, '0');
            let m2 = item.t.match(/(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
            if (m2) return m2[3] + '-' + String(m2[2]).padStart(2, '0') + '-' + String(m2[1]).padStart(2, '0');
        } catch(e){}
    }
    return '';
};

window.setAuQuickDate = function(type) {
    let today = td();
    let startInp = document.getElementById('au-filter-start');
    let endInp = document.getElementById('au-filter-end');
    if (!startInp || !endInp) return;

    if (type === 'today') {
        startInp.value = today;
        endInp.value = today;
    } else if (type === 'yesterday') {
        let d = new Date();
        d.setDate(d.getDate() - 1);
        let yStr = d.toISOString().slice(0, 10);
        startInp.value = yStr;
        endInp.value = yStr;
    } else if (type === 'week') {
        let d = new Date();
        d.setDate(d.getDate() - 6);
        startInp.value = d.toISOString().slice(0, 10);
        endInp.value = today;
    } else if (type === 'month') {
        let d = new Date();
        startInp.value = d.toISOString().slice(0, 8) + '01';
        endInp.value = today;
    } else if (type === 'all') {
        startInp.value = '';
        endInp.value = '';
    }
    window.renderAuHistory();
};

window.renderAuHistory = function() {
    let startVal = (document.getElementById('au-filter-start')?.value || '').trim();
    let endVal = (document.getElementById('au-filter-end')?.value || '').trim();
    let searchVal = (document.getElementById('au-filter-search')?.value || '').trim().toLowerCase();

    window._auDateFilter = startVal;
    window._auDateFilterEnd = endVal;
    window._auSearchText = searchVal;

    let allItems = Array.isArray(S.au) ? S.au : [];
    let filtered = allItems.filter(x => {
        let entryDate = window.parseEntryDate(x);
        
        // Date filtering
        if (startVal && endVal) {
            if (entryDate && (entryDate < startVal || entryDate > endVal)) return false;
            if (!entryDate && startVal) return false;
        } else if (startVal) {
            if (entryDate && entryDate !== startVal) return false;
            if (!entryDate) return false;
        }

        // Search text filtering
        if (searchVal) {
            let str = (String(x.t || '') + ' ' + String(x.u || '') + ' ' + String(x.a || '')).toLowerCase();
            if (!str.includes(searchVal)) return false;
        }

        return true;
    });

    let countBadge = document.getElementById('au-count-badge');
    if (countBadge) {
        countBadge.textContent = 'মোট ' + filtered.length + ' টি রেকর্ড পাওয়া গেছে';
    }

    let tbody = document.getElementById('au-table-body');
    if (tbody) {
        if (!filtered.length) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:32px 16px;color:#94a3b8;font-size:14px">
                <div style="font-size:32px;margin-bottom:8px">🔍</div>

            </td></tr>`;
        } else {

                let parsedD = window.parseEntryDate(x);
                let badgeDate = parsedD ? `<span style="font-size:11px;background:#f1f5f9;color:#475569;padding:2px 6px;border-radius:4px;border:1px solid #e2e8f0;margin-right:6px;font-family:monospace">${parsedD}</span>` : '';
                return `<tr>
                    <td style="font-size:12px;white-space:nowrap;color:#64748b">${badgeDate}${E(x.t)}</td>
                    <td style="font-weight:600;color:var(--p);white-space:nowrap"><span style="background:rgba(15,118,110,0.08);padding:3px 8px;border-radius:12px;font-size:12px">👤 ${E(x.u)}</span></td>
                    <td style="font-size:13px;color:#1e293b;line-height:1.5">${E(x.a)}</td>
                </tr>`;
            }).join('');
        }
    }
};

window.addProprietorField = function (val) {

window.renumberProprietorLabels = function () {
    let rows = document.querySelectorAll('#proprietors-list .proprietor-row');

window.saveShopSettings = function () {
    let sn = ($('#sn') ? $('#sn').value.trim() : S.shop.n) || '';
    let sm = ($('#sm') ? $('#sm').value.trim() : S.shop.m) || '';
    let se = ($('#se') ? $('#se').value.trim() : S.shop.e) || '';
    let sa = ($('#sa') ? $('#sa').value.trim() : (S.shop.a || '')) || '';
    let owners = Array.from(document.querySelectorAll('.shop-proprietor-input'))
        .map(i => i.value.trim())
        .filter(Boolean);
    if (!owners.length) owners = [S.shop.o || ''];
    S.shop.n = sn;
    S.shop.m = sm;
    S.shop.e = se;
    S.shop.a = sa;
    S.shop.owners = owners;
    S.shop.o = owners.join(', ');
    if (typeof CURRENT_SHOP_ID !== 'undefined' && CURRENT_SHOP_ID !== 'default' && Array.isArray(TENANTS)) {
        let t = TENANTS.find(x => x.id === CURRENT_SHOP_ID);
        if (t) {
            t.name = sn;
            t.owner = owners.join(', ');
            t.mobile = sm;
            t.email = se;
            t.address = sa;
            saveTenants();
        }
    }
    log('দোকানের তথ্য ও স্বত্বাধিকারীদের নাম পরিবর্তন');

function printDirect(size) {
    size = size || PHSZ || 'a4';
    PHSZ = size;
    let pa = $('#pa');
    if (pa) {
        pa.innerHTML = PH;
        pa.className = 'pa-' + (size == '80' ? '80' : 'a4');
    }

    // Step 1: Synchronous user-gesture window.open
    let opened = openCleanPrintWindow(PH, size);
    if (opened) {
        return;
    }

    // Step 2: Hidden iframe print
    let ifrSuccess = false;
    try {
        ifrSuccess = printViaIframe(PH, size);
    } catch (e) { }
    if (ifrSuccess) {
        return;
    }

    // Step 3: Native window.print()
    let nativeSuccess = false;
    let mdEl = $('#md');
    let prev = mdEl ? mdEl.style.display : '';
    try {
        if (mdEl) mdEl.style.display = 'none';
        window.focus();
        window.print();
        nativeSuccess = true;
    } catch (e) {
        console.warn('Native window.print() failed:', e);
    } finally {
        if (mdEl && prev) {
            setTimeout(() => { if (mdEl) mdEl.style.display = prev; }, 400);
        }
    }

    // Step 4: If everything blocked (iframe sandbox, popup blockers)
    if (!nativeSuccess) {
        downloadReceiptPdf(PH, size);
        showPrintFallbackBanner(PH, size);
    }
}

function doPrint(h, size) {
    if (h) PH = h;
    printDirect(size);
}

function copyReceiptText(html) {
    let tmp = document.createElement('div');
    tmp.innerHTML = html;
    tmp.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
    tmp.querySelectorAll('tr').forEach(tr => tr.insertAdjacentText('afterend', '\n'));
    tmp.querySelectorAll('td, th').forEach(td => td.insertAdjacentText('afterend', '  |  '));
    tmp.querySelectorAll('h1, h2, h3, h4, p, div').forEach(el => el.insertAdjacentText('afterend', '\n'));
    let text = (tmp.textContent || tmp.innerText || '')
        .split('\n')
        .map(l => l.trim())
        .filter(l => l.length > 0)
        .join('\n');

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            alert('✅ রসিদ টেক্সট কপি হয়েছে! WhatsApp, SMS বা ব্লুটুথ প্রিন্টারে পেস্ট করতে পারেন।');
        }).catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    let ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
        document.execCommand('copy');
        alert('✅ রসিদ টেক্সট কপি হয়েছে!');
    } catch (e) {
        alert('কপি করা যায়নি');
    }
    ta.remove();
}

window.requestBluetoothDeviceConnect = async function() {
    if (!navigator.bluetooth || !navigator.bluetooth.requestDevice) {
        alert('⚠ আপনার ব্রাউজারে Web Bluetooth সরাসরি সক্রিয় নেই। অনুগ্রহ করে অ্যান্ড্রয়েড ফোনে Google Chrome ব্রাউজার ব্যবহার করুন, অথবা RawBT অ্যাপের মাধ্যমে প্রিন্ট করুন।');
        return;
    }
    try {
        let device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: BT_PRINTER_SERVICES
        });
        if (!device) return;
        
        let server = await device.gatt.connect();
        let service = null;
        for (let sUuid of BT_PRINTER_SERVICES) {
            try {
                service = await server.getPrimaryService(sUuid);
                if (service) break;
            } catch(e) {}
        }
        if (!service) {
            let services = await server.getPrimaryServices();
            if (services && services.length) service = services[0];
        }
        if (!service) throw new Error('প্রিন্টার সার্ভিস খুঁজে পাওয়া যায়নি');

window.sendBytesToBluetooth = async function(bytes) {
    if (!btPrinterChar) throw new Error('Bluetooth প্রিন্টার কানেক্টেড নেই');
    let chunkSize = 128;
    for (let i = 0; i < bytes.length; i += chunkSize) {
        let chunk = bytes.slice(i, i + chunkSize);
        if (btPrinterChar.writeValueWithoutResponse) {
            await btPrinterChar.writeValueWithoutResponse(chunk);
        } else {
            await btPrinterChar.writeValue(chunk);
        }
        await new Promise(r => setTimeout(r, 20));
    }
};

window.triggerPwaInstall = function() {
    if (!isMainSuperAdmin() && !can('p_install')) {
        openSoftwareDownloadModal();
        return;
    }
    if (deferredPwaPrompt) {
        deferredPwaPrompt.prompt();
        deferredPwaPrompt.userChoice.then(c => {
            if (c.outcome === 'accepted') {
                deferredPwaPrompt = null;
                updatePwaUI();
                alert('🎉 অভিনন্দন! Shop Management অ্যাপটি সফলভাবে আপনার ডিভাইসে ইনস্টল হয়েছে। এখন থেকে মোবাইলের হোম স্ক্রিন আইকন বা পিসির অ্যাপ থেকে ১-ক্লিকেই সরাসরি অ্যাপ হিসেবে ব্যবহার করতে পারবেন।');
            }
        });
        return;
    }
    openSoftwareDownloadModal();
};

function promptPwaInstall() {
    triggerPwaInstall();
}

// নেটওয়ার্ক অবস্থা পর্যবেক্ষণ
function updateNetStatus() {
    let el = $('#net-stat');
    if (!el) return;
    if (navigator.onLine) {
        el.textContent = '🟢 অনলাইন';
        el.style.background = '#15803d';
    } else {
        el.textContent = '🟠 অফলাইন';
        el.style.background = '#d97706';
    }
}
window.addEventListener('online', () => { updateNetStatus(); });
window.addEventListener('offline', () => { updateNetStatus(); });
setTimeout(updateNetStatus, 500);

// সার্ভিস ওয়ার্কার রেজিস্টার
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('PWA Service Worker registered:', reg.scope);
        }).catch(err => {
            console.log('SW registration note:', err);
        });
    });
}
