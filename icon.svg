<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>
  <circle cx="256" cy="256" r="180" fill="#ffffff" opacity="0.08"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="12 8" opacity="0.25"/>
  <g filter="url(#shadow)" transform="translate(256, 260)">
    <!-- Cart & Storefront stylized emblem -->
    <path d="M-80 -40 L80 -40 L70 40 L-70 40 Z" fill="#ffffff" opacity="0.15"/>
    <text x="0" y="55" font-family="'Hind Siliguri', 'Segoe UI', system-ui, sans-serif" font-size="190" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">S</text>
  </g>
  <circle cx="256" cy="410" r="14" fill="#38bdf8"/>
  <text x="256" y="445" font-family="'Hind Siliguri', sans-serif" font-size="28" font-weight="700" fill="#ccfbf1" text-anchor="middle" letter-spacing="2">Shop Management</text>
</svg>
